# Peripherals for p4_rgb1280_nv3052c
peripherals:
  # LCD backlight PWM (active high), 100 kHz, 8-bit
  - name: ledc_backlight
    type: ledc
    version: default
    config:
      gpio_num: 9
      speed_mode: LEDC_LOW_SPEED_MODE
      channel: 0
      timer_sel: 0
      freq_hz: 100000
      duty_resolution: LEDC_TIMER_8_BIT
      duty: 0

